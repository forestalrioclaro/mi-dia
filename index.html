<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis tareas</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --side:#E7EAE5; --ink:#1D2621; --muted:#65706A;
  --line:#D8DDD6; --pine:#2E6A4D; --pine-ink:#FFFFFF; --pine-soft:#DCEBE2; --amber:#A86C12;
  --amber-soft:#F6E9D2; --danger:#B03D2B; --danger-soft:#F7E0DB; --doing:#C2620F; --doing-soft:#FBE7D4; --gray-soft:#ECEEEA; --leave:#5B47B0; --leave-soft:#ECE8FA; --pause:#2D6A9F; --pause-soft:#DDEAF6;
  --hover:rgba(29,38,33,.05); --shadow:0 1px 2px rgba(29,38,33,.08),0 4px 16px rgba(29,38,33,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816; --surface:#1B2220; --side:#171D1A; --ink:#E5EAE6; --muted:#97A29B;
    --line:#2B3530; --pine:#6DB690; --pine-ink:#0F1A14; --pine-soft:#20352A; --amber:#E2AA4E;
    --amber-soft:#3A2E1A; --danger:#E67C68; --danger-soft:#3D221E; --doing:#F0A060; --doing-soft:#3A2818; --gray-soft:#262E2A; --leave:#B5A6F2; --leave-soft:#2B2642; --pause:#86B6E3; --pause-soft:#1D2C3B;
    --hover:rgba(229,234,230,.06); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131816; --surface:#1B2220; --side:#171D1A; --ink:#E5EAE6; --muted:#97A29B;
  --line:#2B3530; --pine:#6DB690; --pine-ink:#0F1A14; --pine-soft:#20352A; --amber:#E2AA4E;
  --amber-soft:#3A2E1A; --danger:#E67C68; --danger-soft:#3D221E; --doing:#F0A060; --doing-soft:#3A2818; --gray-soft:#262E2A; --leave:#B5A6F2; --leave-soft:#2B2642; --pause:#86B6E3; --pause-soft:#1D2C3B;
  --hover:rgba(229,234,230,.06); --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}
svg{display:block;flex:none}
.app{display:grid;grid-template-columns:270px 1fr auto;height:100%;overflow:hidden}

/* Sidebar */
.side{background:var(--side);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .mark{width:28px;height:28px;border-radius:8px;background:var(--pine);color:var(--pine-ink);display:grid;place-items:center}
.search{margin:6px 14px 10px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.search input{border:0;background:none;outline:none;padding:9px 0;width:100%}
.nav{overflow-y:auto;flex:1;padding:4px 8px 8px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-weight:500}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.nav-item .count{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-item .ico-sun{color:var(--amber)} .nav-item .ico-star{color:var(--danger)} .nav-item .ico-late{color:var(--danger)}
.nav-item[data-view="late"] .count{color:var(--danger);font-weight:700}
.nav-item .ico-cal{color:var(--doing)} .nav-item .ico-home{color:var(--pine)}
.nav-item .ico-list{color:var(--muted)} .nav-item .ico-leave{color:var(--leave)} .nav-item .ico-month{color:var(--doing)} .nav-item .ico-gantt{color:var(--pause)} .nav-item .ico-board{color:var(--pine)} .nav-item .ico-report{color:var(--pine)}
.nav hr{border:0;border-top:1px solid var(--line);margin:8px 10px}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot .row{display:flex;gap:6px}
.ghost{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;font-weight:500;color:var(--ink)}
.ghost:hover{background:var(--hover)}
.sync{font-size:12px;color:var(--muted);padding:0 10px;display:flex;align-items:center;gap:6px}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--pine)} .sync.err .dot{background:var(--danger)}

/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:26px 34px 12px;display:flex;align-items:flex-start;gap:12px}
.burger{display:none;margin-top:6px;padding:6px;border-radius:8px}
.burger:hover{background:var(--hover)}
.title-wrap{flex:1;min-width:0}
.title{font-size:34px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:0;
  border:0;background:none;outline:none;width:100%;padding:0;color:var(--ink)}
.title:focus{box-shadow:0 2px 0 var(--pine)}
.subtitle{color:var(--muted);margin-top:4px;font-size:15px}
.head-actions{display:flex;gap:6px;margin-top:4px}
.chip-btn{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-weight:500;font-size:14px}
.chip-btn:hover{background:var(--hover)}
.chip-btn.danger{color:var(--danger)}
.body{flex:1;overflow-y:auto;padding:4px 34px 40px}
.add{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:0 16px;margin-bottom:14px}
.add .plus{color:var(--pine)}
.add input{border:0;outline:none;background:none;padding:15px 0;flex:1;min-width:0}
.add input::placeholder{color:var(--pine);font-weight:500}
.add input:focus::placeholder{color:var(--muted);font-weight:400}

.group-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-weight:700;font-size:14px}
.group-h.late{color:var(--danger)}
.group-h button{display:flex;align-items:center;gap:8px;font-weight:700}
.group-h .n{color:var(--muted);font-weight:500}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:10px;padding:10px 12px 10px 14px;box-shadow:0 1px 1px rgba(0,0,0,.04);border:1px solid transparent}
.task:hover{border-color:var(--line)}
.task.sel{border-color:var(--pine)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;flex:none;transition:background .15s,border-color .15s}
.chk:hover{border-color:var(--pine);color:var(--pine)}
.task.done .chk{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tbody{flex:1;min-width:0;cursor:pointer}
.ttl{overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-top:2px}
.meta:empty{display:none}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .late{color:var(--danger);font-weight:600}
.meta .today{color:var(--doing);font-weight:600}
.badge-doing{background:var(--doing-soft);color:var(--doing);font-weight:600;border-radius:6px;padding:1px 7px}
.badge-pause{background:var(--pause-soft);color:var(--pause);font-weight:600;border-radius:6px;padding:1px 7px}
.task.paused .ttl{color:var(--muted)}
.opt.on.pause{color:var(--pause)}
.pause-field{display:flex;align-items:center;gap:12px;padding:0 14px 12px 46px}
.pause-field input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg)}
.group-h.paused{color:var(--pause)}
.star{color:var(--muted);padding:4px;border-radius:6px}
.star:hover{color:var(--danger)}
.star.on{color:var(--danger)}
.star.on svg path{fill:currentColor}
.task.pop .chk{animation:pop .3s ease}
@keyframes pop{50%{transform:scale(1.25)}}

.empty{text-align:center;color:var(--muted);padding:48px 20px;max-width:420px;margin:0 auto}
.empty strong{display:block;color:var(--ink);font-size:17px;margin:12px 0 4px}
.empty .big{color:var(--pine);margin:0 auto;opacity:.8}

/* Suggestions */
.sugg{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.sugg h3{margin:0 0 8px;font-size:15px}
.sugg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.sugg-row:first-of-type{border-top:0}
.sugg-row .why{font-size:12.5px;color:var(--muted)}
.icon-btn{padding:6px;border-radius:8px;color:var(--pine)}
.icon-btn:hover{background:var(--pine-soft)}

/* Detail */
.detail{width:360px;background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.detail[hidden]{display:none}
.d-scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:10px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.d-title{display:flex;align-items:flex-start;gap:12px;padding:14px}
.d-title textarea{flex:1;border:0;outline:none;background:none;resize:none;font-size:18px;font-weight:700;line-height:1.3;min-height:26px;padding:0;overflow:hidden}
.step{display:flex;align-items:center;gap:10px;padding:6px 14px}
.step .chk{width:18px;height:18px}
.step.done .chk{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.step.done input{text-decoration:line-through;color:var(--muted)}
.step input{flex:1;border:0;outline:none;background:none;padding:4px 0;min-width:0}
.step .x{color:var(--muted);padding:3px;border-radius:6px;opacity:.6}
.step .x:hover{opacity:1;color:var(--danger)}
.step-add{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;color:var(--pine)}
.step-add input{flex:1;border:0;outline:none;background:none;padding:4px 0}
.step-add input::placeholder{color:var(--pine)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-top:1px solid var(--line)}
.card .opt:first-child{border-top:0}
.opt:hover{background:var(--hover)}
.opt.on{color:var(--pine);font-weight:600}
.opt.on.doing{color:var(--doing)}
.opt .clear{margin-left:auto;color:var(--muted);padding:2px;border-radius:6px}
.field{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.card .field:first-child{border-top:0}
.field label{flex:none;color:var(--muted);font-size:14px;min-width:78px}
.field input,.field select{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.quick button{font-size:13px;padding:5px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.quick button:hover{border-color:var(--pine);color:var(--pine)}
.notes textarea{width:100%;border:0;outline:none;background:none;resize:vertical;min-height:110px;padding:14px}
.d-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.d-foot button{padding:7px;border-radius:8px}
.d-foot button:hover{background:var(--hover)}
.d-foot .del:hover{color:var(--danger)}

/* Report */
.report{display:grid;gap:14px;max-width:780px}
.rep-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.rep-bar input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.primary{background:var(--pine);color:var(--pine-ink);font-weight:600;padding:9px 16px;border-radius:9px;display:inline-flex;align-items:center;gap:8px}
.primary:hover{filter:brightness(1.07)}
.secondary{border:1px solid var(--line);background:var(--surface);font-weight:600;padding:8px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:8px}
.secondary:hover{border-color:var(--pine)}
.rep-sec{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:14px 18px}
.rep-sec h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.rep-sec h3 .n{color:var(--muted);font-weight:500}
.rep-sec ul{margin:0;padding-left:20px}
.rep-sec li{margin:3px 0}
.rep-sec li small{color:var(--muted)}
.rep-sec .none{color:var(--muted);margin:0}
.rep-text{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);font-family:ui-monospace,Consolas,monospace;font-size:13px;resize:vertical}

/* Calendario */
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.legend b{color:var(--ink);font-weight:600}
.lg-ok{background:var(--pine)} .lg-doing{background:var(--doing)} .lg-late{background:var(--danger)} .lg-wait{background:var(--muted)} .lg-paused{background:var(--pause)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-week{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px;padding:0 6px}
.cal-cell{background:var(--surface);border-radius:8px;min-height:108px;padding:6px;display:flex;flex-direction:column;gap:3px;border:1px solid transparent;min-width:0}
.cal-cell.out{opacity:.45}
.cal-cell.is-today{border-color:var(--pine)}
.cal-num{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px;width:24px;height:24px;display:grid;place-items:center}
.is-today .cal-num{color:var(--pine-ink);background:var(--pine);border-radius:999px}
.cal-task{display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.3;padding:3px 6px;border-radius:5px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.cal-task:hover{filter:brightness(.96)}
.cal-task.sel{outline:2px solid var(--ink);outline-offset:1px}
/* Arrastrar y cambiar duración en el calendario */
.cal-task{position:relative}
.cal-grid .cal-task:not(.ghost){cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.rs{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:1;border-radius:3px}
.rs-l{left:-3px}
.rs-r{right:0}
.cal-task:hover .rs{background:rgba(127,127,127,.35)}
.cal-task.dragging{opacity:.45}
.cal-cell.drop{outline:2px dashed var(--pine);outline-offset:-3px}
body.cal-move,body.cal-move *{cursor:grabbing!important}
body.cal-resize,body.cal-resize *{cursor:ew-resize!important}
.cal-hint{margin-left:auto;font-style:italic}
@media (max-width:760px){.cal-hint{display:none}}
/* Semanas con barras continuas */
.cal-grid.cal-weeks{display:flex;flex-direction:column;gap:4px}
.cal-wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:4px;row-gap:3px;min-height:108px}
.cal-wk > .cal-cell{min-height:0;padding:0}
.cal-dh{padding:6px 6px 0;position:relative;z-index:1;pointer-events:none;min-width:0}
.cal-dh.out{opacity:.45}
.cal-dh.holiday .cal-num{color:var(--danger)}
.cal-dh.holiday.is-today .cal-num{color:var(--pine-ink)}
.cal-wk .cal-task{z-index:2;align-self:start;margin:0 6px;width:auto;min-width:0}
.cal-wk .cal-task.cont-l{border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.cal-wk .cal-task.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
/* Carta Gantt */
.g-tools{display:flex;gap:4px;flex-wrap:wrap}
.chip-btn.on{background:var(--pine-soft);color:var(--pine);font-weight:600}
.gantt{position:relative;overflow:auto;max-height:calc(100vh - 215px);border:1px solid var(--line);border-radius:12px;background:var(--surface);--glab:240px}
.g-grid{display:grid;width:max-content;min-width:100%}
.g-corner{grid-column:1;grid-row:1 / span 2;position:sticky;left:0;top:0;z-index:7;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 12px;font-weight:700;font-size:12.5px;color:var(--muted);display:flex;align-items:flex-end}
.g-mon{grid-row:1;position:sticky;top:0;z-index:5;background:var(--surface);font-size:12.5px;font-weight:700;padding:6px 6px 0;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.g-day{grid-row:2;position:sticky;top:26px;z-index:5;background:var(--surface);font-size:11px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);line-height:1.25;padding-top:3px;overflow:hidden}
.g-day b{display:inline-block;min-width:18px;font-weight:600;color:var(--ink)}
.g-day.we b{color:var(--muted)}
.g-day.hol b{color:var(--danger)}
.g-day.today b{background:var(--pine);color:var(--pine-ink);border-radius:999px}
.g-col{border-left:1px solid var(--line);z-index:0}
.g-col.we{background:var(--gray-soft)}
.g-col.abs{background:var(--leave-soft)}
.g-col.hol{background:var(--danger-soft)}
.g-col.today{box-shadow:inset 2px 0 0 var(--pine)}
.g-col.drop{background:var(--pine-soft);outline:2px dashed var(--pine);outline-offset:-2px}
.g-glabel{grid-column:1;position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);padding:10px 12px 0;font-weight:700;font-size:13px;color:var(--pine);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label{grid-column:1;position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);padding:0 12px 0 20px;display:flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer;min-width:0}
.g-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-label:hover{color:var(--pine)}
.g-label.done span{text-decoration:line-through;color:var(--muted)}
.g-label .dot{width:8px;height:8px;border-radius:50%;flex:none}
.gantt .cal-task.g-bar{grid-column:auto;align-self:center;z-index:2;margin:0 2px;width:auto;min-width:0;font-size:12px;padding:3px 7px}
.gantt .g-bar:not(.ghost){cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.gantt .cal-task.cont-l{border-left-width:0;border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.gantt .cal-task.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.g-empty{padding:30px;text-align:center;color:var(--muted)}
.g-zoom{display:inline-flex;align-items:center;gap:2px;margin:0 6px;padding:0 4px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.g-zoom .chip-btn{font-size:18px;font-weight:700;line-height:1;padding:5px 11px}
.g-zoom .chip-btn:disabled{opacity:.35;cursor:default}
.g-zval{font-size:12.5px;color:var(--muted);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
@media (max-width:760px){.gantt{--glab:150px;max-height:none}}
/* Tablero */
.kb-filter{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:var(--surface);font-size:14px}
.kb{display:flex;gap:12px;overflow-x:auto;align-items:flex-start;padding-bottom:12px}

const holidayName = s => HOLIDAYS[s] || "";
const isWeekend = s => { const g = parse(s).getDay(); return g === 0 || g === 6; };
/* Vacaciones y permisos (mantenedor de ausencias) */
const LEAVE_TYPES = ["Vacaciones","Permiso","Licencia médica","Otro"];
const absenceOn = s => state.absences.find(a => a.from <= s && s <= a.to) || null;
const isBusinessDay = s => !isWeekend(s) && !HOLIDAYS[s];
const isWorkday = s => isBusinessDay(s) && !absenceOn(s);
function nextWorkday(s){ let d = s; for (let i = 0; i < 400 && !isWorkday(d); i++) d = addDays(d,1); return d; }
function nextBusinessDay(s){ let d = s; for (let i = 0; i < 30 && !isBusinessDay(d); i++) d = addDays(d,1); return d; }
function countWorkdays(from, to){ let n = 0, d = from; for (let i = 0; i < 1000 && d <= to; i++){ if (isWorkday(d)) n++; d = addDays(d,1); } return n; }
function prevWorkdays(s, k){ let d = s; for (let i = 0; i < 1000 && k > 0; i++){ d = addDays(d,-1); if (isWorkday(d)) k--; } return d; }
// Días hábiles que ocupa una tarea con inicio y vencimiento
function spanDays(start, due){ const out = []; let d = start; for (let i = 0; i < 400 && d <= due; i++){ if (isWorkday(d)) out.push(d); d = addDays(d,1); } return out.length ? out : [due]; }
const hasSpan = t => !!(t.start && t.due && t.start < t.due);
function countBusinessDays(from, to){ let n = 0, d = from; for (let i = 0; i < 1000 && d <= to; i++){ if (isBusinessDay(d)) n++; d = addDays(d,1); } return n; }
function nonWorkingText(s){
  if (HOLIDAYS[s]) return "Feriado: " + HOLIDAYS[s];
  const a = absenceOn(s); if (a) return a.type;
  return isWeekend(s) ? "Fin de semana" : "";
}
function nextMonday(){ const d = new Date(); const k = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate()+k); return ymd(d); }
const DAY_SHORT = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const DAY_LETTER = ["D","L","M","X","J","V","S"];
const DAY_ORDER = [1,2,3,4,5,6,0];
function firstOnOrAfter(s, days){
  const d = parse(s);
  for (let i = 0; i < 7; i++){ if (days.includes(d.getDay())) return nextWorkday(ymd(d)); d.setDate(d.getDate()+1); }
  return nextWorkday(s);
}
// Siguiente repetición: si cae en fin de semana o feriado, pasa al siguiente día hábil
function nextRepeat(s, rep, days){ return nextWorkday(nextRepeatRaw(s, rep, days)); }
function nextRepeatRaw(s, rep, days){
  const d = parse(s);
  if (rep === "days"){
    if (!days || !days.length){ d.setDate(d.getDate()+7); return ymd(d); }
    for (let i = 0; i < 7; i++){ d.setDate(d.getDate()+1); if (days.includes(d.getDay())) break; }
    return ymd(d);
  }
  if (rep === "daily") d.setDate(d.getDate()+1);
  else if (rep === "weekdays"){ do { d.setDate(d.getDate()+1); } while (d.getDay()===0 || d.getDay()===6); }
  else if (rep === "weekly") d.setDate(d.getDate()+7);
  else if (rep === "monthly"){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day,last)); }
  return ymd(d);
}
const REPEAT = {"":"No se repite",daily:"Todos los días",weekdays:"Días laborables (lun a vie)",days:"Días específicos de la semana",weekly:"Cada semana",monthly:"Cada mes"};

function repeatText(t){
  if (t.repeat === "days") return t.repeatDays.length ? DAY_ORDER.filter(d => t.repeatDays.includes(d)).map(d => DAY_SHORT[d]).join(", ") : REPEAT.days;
  return REPEAT[t.repeat] || "";
}

function snapshotShadow(){

function savePending(){ try { localStorage.setItem(LS_PEND, JSON.stringify(pending)); } catch(e){} }
function enqueue(op){
  const key = (op.op.endsWith("Task") ? "t:" : op.op.endsWith("Absence") ? "a:" : "l:") + op.id;
  op.key = key;
  pending = pending.filter(p => p.key !== key);
  pending.push(op);
}
function diffToQueue(){
  let changed = false;
  const seenT = new Set(), seenL = new Set();
  state.lists.forEach(l => { const j = JSON.stringify(listToRow(l)); seenL.add(l.id);
    if (shadow.l.get(l.id) !== j){ enqueue({op:"upsertList", id:l.id, row:listToRow(l)}); shadow.l.set(l.id, j); changed = true; } });
  state.tasks.forEach(t => { const row = taskToRow(t), j = JSON.stringify(row); seenT.add(t.id);
    if (shadow.t.get(t.id) !== j){ enqueue({op:"upsertTask", id:t.id, row}); shadow.t.set(t.id, j); changed = true; } });
  [...shadow.t.keys()].forEach(id => { if (!seenT.has(id)){ enqueue({op:"deleteTask", id}); shadow.t.delete(id); changed = true; } });
  [...shadow.l.keys()].forEach(id => { if (!seenL.has(id)){ enqueue({op:"deleteList", id}); shadow.l.delete(id); changed = true; } });
  const seenA = new Set();
  state.absences.forEach(a => { const row = absenceToRow(a), j = JSON.stringify(row); seenA.add(a.id);
    if (shadow.a.get(a.id) !== j){ enqueue({op:"upsertAbsence", id:a.id, row}); shadow.a.set(a.id, j); changed = true; } });
  [...shadow.a.keys()].forEach(id => { if (!seenA.has(id)){ enqueue({op:"deleteAbsence", id}); shadow.a.delete(id); changed = true; } });
  if (changed){ savePending(); scheduleFlush(); }
}
function scheduleFlush(ms){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms == null ? 800 : ms); }
async function flush(){

    pending = pending.filter(p => !batch.includes(p));
    savePending(); retryDelay = 2000; lastError = false;
  } catch(e){
    if (!e || !e.auth){ lastError = true; scheduleFlush(retryDelay); retryDelay = Math.min(retryDelay * 2, 60000); }
  }
  flushing = false; updateSync();
  if (pending.length && !flushTimer && !lastError) scheduleFlush(300);
}

    let why = "";

  if (t.steps.length){ const d = t.steps.filter(s=>s.done).length; meta.push('<span>'+I.steps+d+' de '+t.steps.length+'</span>'); }
  if (t.due){
    const cls = (!t.done && !t.paused && t.due < tt) ? "late" : (t.due === tt ? "today" : "");
    meta.push('<span class="'+cls+'">'+I.cal.replace('width="20" height="20"','width="13" height="13"')+esc(hasSpan(t) ? dueLabel(t.start) + " – " + dueLabel(t.due) : dueLabel(t.due))+'</span>');
  }
  if (t.repeat && !t.done) meta.push('<span>↻ '+esc(repeatText(t))+'</span>');
  if (t.notes.trim()) meta.push('<span>'+I.note+'Nota</span>');
  return '<li class="task'+(t.done?' done':'')+(t.paused&&!t.done?' paused':'')+(selected===t.id?' sel':'')+'" data-id="'+esc(t.id)+'">'
    + '<button class="chk" data-act="toggle" aria-label="'+(t.done?'Marcar como pendiente':'Marcar como completada')+'">'+I.check+'</button>'
    + '<div class="tbody" data-act="open" tabindex="0" role="button"><div class="ttl">'+esc(t.title)+'</div><div class="meta">'+meta.join("")+'</div></div>'
    + '<button class="star'+(t.important?' on':'')+'" data-act="star" aria-label="'+(t.important?'Quitar importancia':'Marcar como importante')+'">'+I.star+'</button></li>';
}
function block(title, items, showList, cls){
  if (!items.length) return "";
  return '<div class="group-h '+(cls||'')+'">'+esc(title)+' <span class="n">'+items.length+'</span></div><ul class="tasks">'+items.map(t => taskRow(t, showList)).join("")+'</ul>';
}
function doneBlock(items, showList){
  if (!items.length) return "";
  return '<div class="group-h"><button data-act="toggleDone">'+(showDone?I.chevd:I.chev)+'Completadas <span class="n">'+items.length+'</span></button></div>'
    + (showDone ? '<ul class="tasks">'+items.sort(sortDone).map(t => taskRow(t, showList)).join("")+'</ul>' : "");
}
function emptyState(v){
  const msgs = {
    myday:["Organiza tu día","Escribe arriba lo que harás hoy y presiona Enter. Revisa las sugerencias para traer tareas vencidas o pendientes de ayer."],
    important:["Nada marcado como importante","Marca una tarea con la estrella para verla aquí."],
    planned:["Sin fechas de vencimiento","Las tareas con fecha aparecen aquí, agrupadas por día."],
    late:["¡Sin atrasos!","Las tareas cuya fecha de vencimiento ya pasó aparecen aquí (excepto las que están en pausa)."],
    search:["Sin resultados","Prueba con otra palabra."],
    list:["Lista vacía","Agrega tu primera tarea arriba."]
  };
  const m = msgs[v] || msgs.list;
  const ico = v==="myday"?I.sun:v==="important"?I.star:v==="planned"?I.cal:v==="late"?I.late:I.list;
  return '<div class="empty"><div class="big">'+ico.replace('width="20" height="20"','width="54" height="54"')+'</div><strong>'+m[0]+'</strong>'+m[1]+'</div>';
}
function renderMain(){
  const title = document.getElementById("title");
  const sub = document.getElementById("subtitle");
  const acts = document.getElementById("headActions");
  const body = document.getElementById("body");
  const isCustom = view.startsWith("list:") && view !== "list:tasks";
  title.readOnly = !isCustom;
  acts.innerHTML = "";
  sub.textContent = "";
  if (view === "report"){ renderReport(); return; }
  if (view === "calendar"){ renderCalendar(); return; }
  if (view === "gantt"){ renderGantt(); return; }
  if (view === "board"){ renderBoard(); return; }
  if (view === "leave"){ renderLeave(); return; }

  let name = {myday:"Mi día",important:"Importante",planned:"Planificado",search:"Buscar",late:"Atrasadas"}[view] || listName(view.slice(5));
  if (view === "late") sub.textContent = "Tareas cuya fecha ya pasó. Ábrelas para completarlas, reprogramarlas o pausarlas.";
  if (view === "search") name = "Buscar: " + query;
  if (document.activeElement !== title) title.value = name;
  if (view === "myday"){
    const nw = nonWorkingText(today());
    sub.textContent = fmtLong(today()) + (nw ? " · " + nw : "");
    const n = suggestions().length;
    acts.innerHTML = '<button class="chip-btn" data-act="sugg">'+I.bulb+'Sugerencias'+(n?' ('+n+')':'')+'</button>';
  }
  if (isCustom) acts.innerHTML = '<button class="chip-btn danger" data-act="delList">'+I.trash+'Eliminar lista</button>';

  let h = "";
  if (view !== "search" && view !== "late") h += '<div class="add"><span class="plus">'+I.plus+'</span><input id="addInput" placeholder="Agregar una tarea" aria-label="Agregar una tarea" autocomplete="off"></div>';

  if (view === "myday" && showSugg){
    const sg = suggestions();
    h += '<div class="sugg"><h3>Sugerencias para hoy</h3>' + (sg.length ? sg.map(s =>
      '<div class="sugg-row" data-id="'+esc(s.task.id)+'"><div style="flex:1;min-width:0"><div>'+esc(s.task.title)+'</div><div class="why">'+esc(s.why)+' · '+esc(listName(s.task.listId))+'</div></div>'
      +'<button class="icon-btn" data-act="addMyDay" aria-label="Agregar a Mi día">'+I.plus+'</button></div>').join("")
      : '<p class="why" style="margin:0">No hay tareas vencidas ni pendientes de días anteriores.</p>') + '</div>';
  }

  const items = tasksFor(view);
  const open = items.filter(t => !t.done).sort(sortOpen);
  const done = items.filter(t => t.done);
  const showList = !view.startsWith("list:");

  if (!items.length) h += emptyState(view.startsWith("list:") ? "list" : view);
  else if (view === "planned"){
    const t = today(), tm = addDays(t,1), wk = addDays(t,7);
    const g = {late:[],today:[],tom:[],week:[],later:[],paused:[]};
    open.sort((a,b) => a.due.localeCompare(b.due) || sortOpen(a,b)).forEach(x => {
      if (x.paused) g.paused.push(x); else if (x.due < t) g.late.push(x); else if (x.due === t) g.today.push(x);
      else if (x.due === tm) g.tom.push(x); else if (x.due <= wk) g.week.push(x); else g.later.push(x);
    });
    h += block("Vencidas", g.late, true, "late") + block("Hoy", g.today, true) + block("Mañana", g.tom, true)
      + block("Próximos 7 días", g.week, true) + block("Más adelante", g.later, true) + block("En pausa", g.paused, true, "paused");
    if (!open.length) h += emptyState("planned");
  } else {
    h += open.length ? '<ul class="tasks">'+open.map(t => taskRow(t, showList)).join("")+'</ul>' : "";
    h += doneBlock(done, showList);
  }
  body.innerHTML = h;
}

function autoGrow(ta){ if (!ta) return; ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

/* ---------- Calendario ---------- */
// Fecha en que aparece cada tarea: vencimiento, si no Mi día, si no fecha de término, si no fecha de creación
function calDate(t){ return t.due || t.myDay || (t.completedAt ? ymd(new Date(t.completedAt)) : ymd(new Date(t.createdAt))); }
function pauseText(t){ return "En pausa" + (t.pausedAt ? " desde el " + fmtShort(t.pausedAt) : "") + (t.pauseReason ? ". Motivo: " + t.pauseReason : ""); }
function calStatus(t){
  if (t.done) return "ok";
  if (t.paused) return "paused";
  if (t.doing) return "doing";
  if (t.due && t.due < today()) return "late";
  return "wait";
}
const ST_LABEL = {ok:"Completada", doing:"En desarrollo", late:"Atrasada", wait:"Por iniciar", paused:"En pausa"};
function renderCalendar(){
  document.getElementById("title").value = "Calendario";
  const m = parse(calMonth);
  const mn = m.toLocaleDateString("es-CL",{month:"long",year:"numeric"});
  document.getElementById("subtitle").textContent = mn.charAt(0).toUpperCase() + mn.slice(1);
  document.getElementById("headActions").innerHTML =
    '<button class="chip-btn" data-act="calPrev" aria-label="Mes anterior">'+I.chevl+'</button>'
    + '<button class="chip-btn" data-act="calToday">Hoy</button>'
    + '<button class="chip-btn" data-act="calNext" aria-label="Mes siguiente">'+I.chev+'</button>'
    + '<button class="chip-btn'+(calDone?' on':'')+'" data-act="calDone" title="'+(calDone?'Ocultar':'Ver')+' las tareas ya completadas">'+I.check.replace('width="12" height="12"','width="15" height="15"')+(calDone?'Ocultar listas':'Ver listas')+'</button>';
  const byDay = {};
  const visible = state.tasks.filter(t => calDone || !t.done);
  visible.forEach(t => {
    const days = hasSpan(t) ? spanDays(t.start, t.due) : [calDate(t)];
    days.forEach((d, i) => (byDay[d] = byDay[d] || []).push({t, i:i+1, n:days.length}));
  });
  const order = {late:0, doing:1, wait:2, paused:3, ok:4};
  Object.keys(byDay).forEach(k => byDay[k].sort((x,y) => order[calStatus(x.t)] - order[calStatus(y.t)] || x.t.createdAt - y.t.createdAt));
  const start = new Date(m); start.setDate(1 - ((m.getDay()+6) % 7));
  const last = new Date(m.getFullYear(), m.getMonth()+1, 0);
  const end = new Date(last); end.setDate(last.getDate() + (6 - ((last.getDay()+6) % 7)));
  const tt = today();
  const counted = {ok:new Set(), doing:new Set(), late:new Set(), wait:new Set(), paused:new Set()};
  const chip = e => { const t = e.t, s = calStatus(t), part = e.n > 1 ? ' (día '+e.i+' de '+e.n+')' : '';
    const handles = (e.i === 1 ? '<span class="rs rs-l" data-rs="start" title="Arrastra para cambiar el inicio"></span>' : '')
      + (e.i === e.n ? '<span class="rs rs-r" data-rs="end" title="Arrastra para cambiar el vencimiento"></span>' : '');
    return '<button class="cal-task st-'+s+(selected===t.id?' sel':'')+'" data-act="open" data-id="'+esc(t.id)+'" title="'+esc(t.title+' — '+ST_LABEL[s]+part)+'">'+handles+(t.repeat&&!t.done?'↻ ':'')+esc(t.title)+(e.n > 1 ? ' <small>'+e.i+'/'+e.n+'</small>' : '')+'</button>'; };
  const ghostChip = t => '<button class="cal-task ghost" data-act="open" data-id="'+esc(t.id)+'" title="'+esc(t.title+' — Repetición programada ('+repeatText(t)+')')+'">↻ '+esc(t.title)+'</button>';
  const endKey = ymd(end), ghosts = {};
  state.tasks.filter(t => !t.done && t.repeat && t.due).forEach(t => {
    const len = hasSpan(t) ? spanDays(t.start, t.due).length : 1;
    let d = t.due;
    for (let i = 0; i < 400; i++){
      d = nextRepeat(d, t.repeat, t.repeatDays);
      const s = len > 1 ? prevWorkdays(d, len - 1) : d;
      if (s > endKey) break;
      (len > 1 ? spanDays(s, d) : [d]).forEach(x => { if (!(ghosts[x] || []).includes(t)) (ghosts[x] = ghosts[x] || []).push(t); });
    }
  });
  // Calendario por semanas: cada tarea es una sola barra que cruza los días que abarca
  const dBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const occ = [];
  visible.forEach(t => { const s0 = hasSpan(t) ? t.start : calDate(t); occ.push({t, s:s0, e:hasSpan(t) ? t.due : s0, ghost:false}); });
  state.tasks.filter(t => !t.done && t.repeat && t.due).forEach(t => {
    const len = hasSpan(t) ? spanDays(t.start, t.due).length : 1;
    let d = t.due;
    for (let i = 0; i < 400; i++){
      d = nextRepeat(d, t.repeat, t.repeatDays);
      const s = len > 1 ? prevWorkdays(d, len - 1) : d;
      if (s > endKey) break;
      occ.push({t, s, e:d, ghost:true});
    }
  });
  const bar = sg => {
    const o = sg.o, t = o.t, s = o.ghost ? "" : calStatus(t);
    const range = o.s === o.e ? fmtShort(o.e) : fmtShort(o.s) + " al " + fmtShort(o.e);
    const tip = o.ghost ? t.title + " — Repetición programada (" + range + ")" : t.title + " — " + ST_LABEL[s] + " (" + range + ")";
    const handles = o.ghost ? "" : (!sg.contL ? '<span class="rs rs-l" data-rs="start" title="Arrastra para cambiar el inicio"></span>' : '')
      + (!sg.contR ? '<span class="rs rs-r" data-rs="end" title="Arrastra para cambiar el vencimiento"></span>' : '');
    return '<button class="cal-task '+(o.ghost ? 'ghost' : 'st-'+s)+(selected===t.id&&!o.ghost?' sel':'')+(sg.contL?' cont-l':'')+(sg.contR?' cont-r':'')+'" data-act="open" data-id="'+esc(t.id)+'"'
      + ' style="grid-column:'+(sg.c1+1)+' / '+(sg.c2+2)+';grid-row:'+(sg.lane+2)+'" title="'+esc(tip)+'">'+handles+((t.repeat&&!t.done)||o.ghost?'↻ ':'')+esc(t.title)+'</button>';
  };
  let weeks = "";
  for (let w = new Date(start); w <= end; w.setDate(w.getDate()+7)){
    const ws = ymd(w), we = addDays(ws, 6);
    const segs = occ.filter(o => o.s <= we && o.e >= ws).map(o => {
      const a = o.s < ws ? ws : o.s, b = o.e > we ? we : o.e;
      return {o, c1:dBetween(ws, a), c2:dBetween(ws, b), contL:o.s < ws, contR:o.e > we};
    });
    segs.sort((x,y) => x.c1 - y.c1 || (y.c2 - y.c1) - (x.c2 - x.c1) || (x.o.ghost - y.o.ghost)
      || (x.o.ghost ? 0 : order[calStatus(x.o.t)] - order[calStatus(y.o.t)]) || x.o.t.createdAt - y.o.t.createdAt);
    const laneEnd = [];
    segs.forEach(sg => { let l = laneEnd.findIndex(e => e < sg.c1); if (l < 0){ l = laneEnd.length; laneEnd.push(sg.c2); } else laneEnd[l] = sg.c2; sg.lane = l; });
    let row = "";
    for (let i = 0; i < 7; i++){
      const k = addDays(ws, i), dd = parse(k), out = dd.getMonth() !== m.getMonth();
      const hol = holidayName(k), abs = absenceOn(k);
      const dayCls = hol ? ' holiday' : isWeekend(k) ? ' weekend' : '';
      const labels = (hol ? '<div class="cal-hol">'+esc(hol)+'</div>' : '') + (abs ? '<div class="cal-abs">'+esc(abs.type)+'</div>' : '');
      row += '<div class="cal-cell'+dayCls+(abs&&!hol?' absent':'')+(out?' out':'')+(k===tt?' is-today':'')+'" data-date="'+k+'" style="grid-column:'+(i+1)+';grid-row:1 / -1"'+(hol?' title="Feriado: '+esc(hol)+'"':'')+'></div>'
        + '<div class="cal-dh'+(hol?' holiday':'')+(out?' out':'')+(k===tt?' is-today':'')+'" style="grid-column:'+(i+1)+';grid-row:1"><div class="cal-num">'+dd.getDate()+'</div>'+labels+'</div>';
    }
    row += segs.map(bar).join("") + '<div class="cal-fill" style="grid-row:'+(laneEnd.length+2)+'"></div>';
    weeks += '<div class="cal-wk" style="grid-template-rows:auto'+(laneEnd.length ? ' repeat('+laneEnd.length+',auto)' : '')+' 1fr">'+row+'</div>';
  }
  let agenda = "";
  for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){
    const k = ymd(d), items = byDay[k] || [], out = d.getMonth() !== m.getMonth();
    if (!out) items.forEach(e => counted[calStatus(e.t)].add(e.t.id));
    const gh = ghosts[k] || [];
    const hol = holidayName(k);
    const dayCls = hol ? ' holiday' : isWeekend(k) ? ' weekend' : '';
    const abs = absenceOn(k);
    const holHtml = (hol ? '<div class="cal-hol">'+esc(hol)+'</div>' : '') + (abs ? '<div class="cal-abs">'+esc(abs.type)+'</div>' : '');
    const html = items.map(chip).join("") + gh.map(ghostChip).join("");
    if (!out && (items.length || gh.length || hol || abs)) agenda += '<div class="ag-day'+(hol?' holiday':abs?' absent':'')+(k===tt?' is-today':'')+'"><div class="ag-h">'+esc(fmtLong(k))+(hol?' · Feriado':'')+'</div>'+holHtml+html+'</div>';
  }
  const lg = s => (s === "ok" && !calDone) ? '' : '<span><i class="lg-'+s+'"></i>'+ST_LABEL[s]+' <b>'+counted[s].size+'</b></span>';
  document.getElementById("body").innerHTML =
    '<div class="legend">'+lg("ok")+lg("doing")+lg("late")+lg("wait")+lg("paused")+'<span><i class="lg-ghost"></i>Repetición programada</span><span><i class="lg-hol"></i>Feriado</span><span><i class="lg-abs"></i>Vacaciones o permiso</span><span><i class="lg-we"></i>Fin de semana</span><span class="cal-hint">Arrastra una tarea para moverla; estira sus bordes para cambiar los días</span></div>'
    + '<div class="cal-week"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>'
    + '<div class="cal-grid cal-weeks">'+weeks+'</div>'
    + '<div class="agenda">'+(agenda || '<p class="none">No hay tareas este mes.</p>')+'</div>';
}

/* ---------- Carta Gantt ---------- */
function renderGantt(){
  const z = GZ[ganttZoom], N = z.days, gs = ganttStart, ge = addDays(gs, N - 1), tt = today();
  const W = Math.round(z.w * ganttScale);
  const labW = window.matchMedia("(max-width:760px)").matches ? Math.round(150 * Math.min(ganttScale, 1.5)) : Math.round(Math.min(480, 240 * Math.max(1, Math.min(ganttScale, 2))));
  const dB = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  document.getElementById("title").value = "Carta Gantt";
  document.getElementById("subtitle").textContent = fmtShort(gs) + " al " + fmtShort(ge) + " · arrastra las barras para mover tareas y estira sus bordes para cambiar los días";
  document.getElementById("headActions").innerHTML = '<div class="g-tools">'
    + '<button class="chip-btn" data-act="gPrev" aria-label="Anterior">'+I.chevl+'</button>'
    + '<button class="chip-btn" data-act="gToday">Hoy</button>'
    + '<button class="chip-btn" data-act="gNext" aria-label="Siguiente">'+I.chev+'</button>'
    + '<span class="g-zoom"><button class="chip-btn" data-act="gOut" title="Alejar"'+(ganttScale === G_SCALES[0] ? ' disabled' : '')+' aria-label="Alejar">−</button>'
    + '<span class="g-zval">'+Math.round(ganttScale * 100)+'%</span>'
    + '<button class="chip-btn" data-act="gIn" title="Acercar para leer mejor los títulos"'+(ganttScale === G_SCALES[G_SCALES.length-1] ? ' disabled' : '')+' aria-label="Acercar">+</button></span>'
    + Object.keys(GZ).map(k => '<button class="chip-btn'+(ganttZoom===k?' on':'')+'" data-act="gZoom" data-z="'+k+'">'+GZ[k].label+'</button>').join("")
    + '<button class="chip-btn'+(ganttDone?' on':'')+'" data-act="gDone">Completadas</button></div>';
  // Filas: tareas con fecha que tocan el período (o alguna de sus repeticiones), agrupadas por lista
  const groups = [...state.lists.map(l => ({id:l.id, name:l.name})), {id:"tasks", name:"Tareas"}];
  const rows = [];
  groups.forEach(g => {
    const items = [];
    state.tasks.filter(t => t.listId === g.id && t.due && (ganttDone || !t.done)).forEach(t => {
      const s0 = hasSpan(t) ? t.start : t.due, e0 = t.due, bars = [];
      if (s0 <= ge && e0 >= gs) bars.push({s:s0, e:e0, ghost:false});
      if (!t.done && t.repeat){
        const len = hasSpan(t) ? spanDays(t.start, t.due).length : 1;
        let d = t.due;
        for (let i = 0; i < 400; i++){
          d = nextRepeat(d, t.repeat, t.repeatDays);
          const s = len > 1 ? prevWorkdays(d, len - 1) : d;
          if (s > ge) break;
          if (d >= gs) bars.push({s, e:d, ghost:true});
        }
      }
      if (bars.length) items.push({t, bars, first:bars[0].s});
    });
    if (items.length){
      items.sort((a,b) => a.first.localeCompare(b.first) || a.t.createdAt - b.t.createdAt);
      rows.push({group:g.name});
      items.forEach(it => rows.push(it));
    }
  });
  const R = rows.length;
  let h = '<div class="g-corner">Tarea</div>';
  // Meses
  for (let i = 0; i < N;){
    const k = addDays(gs, i), mo = k.slice(0,7); let n = 0;
    while (i + n < N && addDays(gs, i + n).slice(0,7) === mo) n++;
    h += '<div class="g-mon" style="grid-column:'+(i+2)+' / span '+n+'">'+(n * W >= 60 ? esc((m => m.charAt(0).toUpperCase() + m.slice(1))(parse(k).toLocaleDateString("es-CL",{month:"long", year:"numeric"}))) : '')+'</div>';
    i += n;
  }
  // Días y columnas de fondo
  for (let i = 0; i < N; i++){
    const k = addDays(gs, i), dd = parse(k), hol = holidayName(k), abs = absenceOn(k), we = isWeekend(k);
    const cls = (we ? ' we' : '') + (hol ? ' hol' : '') + (abs && !hol ? ' abs' : '') + (k === tt ? ' today' : '');
    const showNum = W >= 20 || dd.getDay() === 1 || k === tt;
    const tip = fmtLong(k) + (hol ? ' · Feriado: ' + hol : abs ? ' · ' + abs.type : '');
    h += '<div class="g-day'+cls+'" style="grid-column:'+(i+2)+'" title="'+esc(tip)+'">'+(W >= 30 ? DAY_LETTER[dd.getDay()] + '<br>' : '')+(showNum ? '<b>'+dd.getDate()+'</b>' : '')+'</div>';
    if (R) h += '<div class="g-col'+cls+'" data-date="'+k+'" style="grid-column:'+(i+2)+';grid-row:3 / span '+R+'"></div>';
  }
  // Filas de tareas y barras
  rows.forEach((row, idx) => {
    const r = idx + 3;
    if (row.group){ h += '<div class="g-glabel" style="grid-row:'+r+'">'+esc(row.group)+'</div>'; return; }
    const t = row.t, st = calStatus(t);
    const dotColor = {ok:"var(--pine)", doing:"var(--doing)", late:"var(--danger)", wait:"var(--muted)", paused:"var(--pause)"}[st];
    h += '<div class="g-label'+(t.done?' done':'')+'" style="grid-row:'+r+'" data-act="open" data-id="'+esc(t.id)+'" title="'+esc(t.title)+'"><i class="dot" style="background:'+dotColor+'"></i><span>'+esc(t.title)+'</span></div>';
    row.bars.forEach(b => {
      const a = b.s < gs ? gs : b.s, e = b.e > ge ? ge : b.e, contL = b.s < gs, contR = b.e > ge;
      const range = b.s === b.e ? fmtShort(b.e) : fmtShort(b.s) + ' al ' + fmtShort(b.e);
      const tip = t.title + ' — ' + (b.ghost ? 'Repetición programada' : ST_LABEL[st]) + ' (' + range + ')' + (t.paused ? '. ' + pauseText(t) : '');
      const handles = b.ghost ? '' : (!contL ? '<span class="rs rs-l" data-rs="start" title="Arrastra para cambiar el inicio"></span>' : '') + (!contR ? '<span class="rs rs-r" data-rs="end" title="Arrastra para cambiar el vencimiento"></span>' : '');
      h += '<button class="cal-task g-bar '+(b.ghost ? 'ghost' : 'st-'+st)+(selected===t.id&&!b.ghost?' sel':'')+(contL?' cont-l':'')+(contR?' cont-r':'')+'" data-act="open" data-id="'+esc(t.id)+'"'
        + ' style="grid-column:'+(dB(gs, a)+2)+' / '+(dB(gs, e)+3)+';grid-row:'+r+'" title="'+esc(tip)+'">'+handles+(t.repeat&&!t.done||b.ghost?'↻ ':'')+esc(t.title)+'</button>';
    });
  });
  const legend = '<div class="legend">'+["ok","doing","late","wait","paused"].map(s => '<span><i class="lg-'+s+'"></i>'+ST_LABEL[s]+'</span>').join("")
    + '<span><i class="lg-ghost"></i>Repetición programada</span><span><i class="lg-hol"></i>Feriado</span><span><i class="lg-abs"></i>Vacaciones o permiso</span><span><i class="lg-we"></i>Fin de semana</span></div>';
  document.getElementById("body").innerHTML = legend + '<div class="gantt" style="--glab:'+labW+'px"><div class="g-grid" style="grid-template-columns:var(--glab) repeat('+N+','+W+'px);grid-template-rows:26px 36px'+(R ? ' repeat('+R+',34px)' : '')+'">'+h+'</div>'
    + (R ? '' : '<div class="g-empty">No hay tareas con fecha en este período. Usa las flechas para moverte o ponle fechas a tus tareas.</div>') + '</div>';
  const sc = document.querySelector(".gantt");
  if (sc){ sc.addEventListener("scroll", ganttStickTitles, {passive:true}); ganttStickTitles(); }
}
// Mantiene visible el título de las barras que empiezan antes de la parte visible (detrás de la columna de nombres)
function ganttStickTitles(){
  const sc = document.querySelector(".gantt"); if (!sc) return;
  const edge = sc.scrollLeft + (parseFloat(sc.style.getPropertyValue("--glab")) || 240);
  sc.querySelectorAll(".g-bar").forEach(b => {
    const hidden = edge - b.offsetLeft;
    b.style.paddingLeft = hidden > 0 ? Math.max(7, Math.min(hidden + 7, b.offsetWidth - 80)) + "px" : "";
  });
}

/* ---------- Tablero (Kanban por estado) ---------- */
const isLate = t => !t.done && !t.paused && !!t.due && t.due < today();
const KB_COLS = [
  {id:"late", label:"Atrasadas"}, {id:"todo", label:"Por iniciar"}, {id:"doing", label:"En curso"}, {id:"paused", label:"En pausa"}, {id:"done", label:"Completada"}
];
const kbState = t => t.done ? "done" : t.paused ? "paused" : t.doing ? "doing" : "todo";
function renderBoard(){
  document.getElementById("title").value = "Tablero";
  document.getElementById("subtitle").textContent = "Arrastra las tarjetas entre columnas para cambiar su estado";
  const lists = [{id:"all", name:"Todas las listas"}, ...state.lists.map(l => ({id:l.id, name:l.name})), {id:"tasks", name:"Tareas"}];

    paused: tasks.filter(t => kbState(t) === "paused").sort((a,b) => (a.pausedAt || "").localeCompare(b.pausedAt || "") || byDue(a,b)),

    const st = kbState(t), late = st !== "done" && st !== "paused" && t.due && t.due < tt;
    const meta = [];
    if (t.important) meta.push('<span class="kb-star" title="Importante">★</span>');
    if (boardList === "all") meta.push('<span class="kb-tag">'+esc(listName(t.listId))+'</span>');
    if (st === "done" && t.completedAt) meta.push('<span>'+I.check.replace('width="12" height="12"','width="11" height="11"')+'Completada el '+esc(fmtShort(ymd(new Date(t.completedAt))))+'</span>');
    else if (t.due) meta.push('<span class="'+(late ? 'late' : '')+'">'+I.cal.replace('width="20" height="20"','width="13" height="13"')+esc(hasSpan(t) ? dueLabel(t.start) + ' – ' + dueLabel(t.due) : dueLabel(t.due))+'</span>');
    if (t.repeat && st !== "done") meta.push('<span title="'+esc(repeatText(t))+'">↻</span>');
    if (t.steps.length){ const n = t.steps.filter(x => x.done).length; meta.push('<span>'+I.steps+n+'/'+t.steps.length+'</span>'); }
    if (t.notes.trim()) meta.push('<span>'+I.note+'</span>');
    return '<div class="kb-card'+(st==='done'?' done':'')+(late?' late':'')+(selected===t.id?' sel':'')+'" draggable="true" data-act="open" data-id="'+esc(t.id)+'" tabindex="0" role="button">'
      + '<div class="kb-title">'+esc(t.title)+'</div>'
      + (st === "paused" && (t.pauseReason || t.pausedAt) ? '<div class="kb-reason">'+esc(pauseText(t))+'</div>' : '')
      + (late ? '<div class="kb-late-info">'+(n => 'Atrasada ' + n + (n === 1 ? ' día' : ' días'))(Math.round((parse(tt) - parse(t.due)) / 86400000))+' <small>· estaba '+(st === "doing" ? 'en curso' : 'por iniciar')+'</small></div>' : '')
      + (meta.length ? '<div class="kb-meta">'+meta.join("")+'</div>' : '')
      + (late ? '<div class="kb-q">'
          + '<button data-act="kbq" data-q="done" title="Ya la terminé, me faltó marcarla">✓ Ya está hecha</button>'

          + '<button data-act="kbq" data-q="next" title="Cambiar el vencimiento al siguiente día hábil">'+esc(dueLabel(nextWorkday(addDays(tt,1))))+'</button>'
          + '<button class="q-pause" data-act="kbq" data-q="pause" title="Estoy esperando información de otra persona">⏸ Pausar</button>'
          + '</div>' : '')

  document.getElementById("body").innerHTML = '<div class="kb">' + KB_COLS.map(c => {

    return '<div class="kb-col '+c.id+'" data-col="'+c.id+'"><div class="kb-head"><span class="kb-pill '+c.id+'">'+c.label+'</span><span class="kb-count">'+count+'</span></div>'
      + (c.id === "late" && items.length ? '<div class="kb-hint">¿La terminaste, necesitas más tiempo o esperas información? Usa los botones de cada tarjeta.</div>' : '')
      + '<div class="kb-list">' + (items.length ? items.map(card).join("") : '<div class="kb-empty">'+(c.id === "late" ? '¡Sin atrasos!' : 'Arrastra tareas aquí')+'</div>') + '</div>'
      + (c.id === "late" ? '' : c.id === "done"
          ? (doneTotal > cols.done.length || boardAllDone ? '<div class="kb-more">'+(boardAllDone ? 'Mostrando todas · ' : 'Últimos 30 días · ')+'<button data-act="kbAllDone">'+(boardAllDone ? 'Ver solo últimos 30 días' : 'Ver todas')+'</button></div>' : '')
          : '<div class="kb-add"><input data-kbadd="'+c.id+'" placeholder="'+placeholder[c.id]+'" aria-label="'+placeholder[c.id]+'" autocomplete="off"></div>')
      + '</div>';
  }).join("") + '</div>';

function quickLate(t, q){
  if (q === "done"){ setTaskState(t, "done"); return; }
  if (q === "pause"){ setTaskState(t, "paused"); openTask(t.id); const r = document.getElementById("dPauseReason"); if (r) r.focus(); return; }
  const nd = q === "today" ? today() : nextWorkday(addDays(today(), 1));
  t.due = nd; if (t.start && t.start >= nd) t.start = "";
  commit();
  toast("“" + t.title + "” reprogramada para " + (q === "today" ? "hoy" : fmtShort(nd)) + ".");
}
function setTaskState(t, st){
  if (st === "late"){ toast("A “Atrasadas” se llega por fecha. Para mover una tarea aquí, cambia su vencimiento."); return; }
  if (kbState(t) === st) return;
  if (st === "done"){ toggleTask(t.id); toast("“" + t.title + "” completada."); return; }
  if (t.done){ t.done = false; t.completedAt = 0; }
  t.doing = st === "doing";
  if (st === "doing" && t.myDay !== today()) t.myDay = today();
  if (st === "paused"){ if (!t.paused) t.pausedAt = today(); t.paused = true; }
  else { t.paused = false; t.pauseReason = ""; t.pausedAt = ""; }
  commit();
  toast("“" + t.title + "” → " + KB_COLS.find(c => c.id === st).label + (st === "paused" ? ". Puedes anotar el motivo en el detalle." : "."));
}

/* ---------- Vacaciones y permisos ---------- */
const fmtRange = (a, b) => parse(a).toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short",year:"numeric"})
  + (a === b ? "" : " al " + parse(b).toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short",year:"numeric"}));
const returnDay = to => nextBusinessDay(addDays(to,1));
function leaveCheck(d){
  if (!d.from || !d.to) return {ok:false, msg:"Elige la fecha de inicio y el último día de ausencia."};
  if (d.to < d.from) return {ok:false, msg:"El último día no puede ser anterior al primero."};
  const clash = state.absences.find(a => a.id !== leaveEdit && a.from <= d.to && d.from <= a.to);
  if (clash) return {ok:false, msg:"Se cruza con " + clash.type.toLowerCase() + " del " + fmtRange(clash.from, clash.to) + "."};
  const n = countBusinessDays(d.from, d.to);
  return {ok:true, msg:n + (n === 1 ? " día hábil" : " días hábiles") + ". Vuelves a trabajar el " + fmtLong(returnDay(d.to)) + "."};
}
function updateLeaveInfo(){
  const el = document.getElementById("lvInfo"); if (!el) return;
  const c = leaveCheck(leaveDraft);
  el.textContent = (leaveDraft.from || leaveDraft.to) ? c.msg : "";
  el.className = "lv-info" + (c.ok || !(leaveDraft.from && leaveDraft.to) ? "" : " err");
}
function renderLeave(){
  document.getElementById("title").value = "Vacaciones y permisos";
  document.getElementById("subtitle").textContent = "Los días que marques aquí no cuentan como hábiles: las repeticiones se corren al día en que vuelves";
  const d = leaveDraft, tt = today();
  const typeOpts = LEAVE_TYPES.map(x => '<option'+(d.type===x?' selected':'')+'>'+esc(x)+'</option>').join("");
  const list = state.absences.slice().sort((a,b) => b.from.localeCompare(a.from));
  const row = a => { const n = countBusinessDays(a.from, a.to);
    return '<div class="lv-row'+(a.to < tt ? ' past' : '')+'" data-id="'+esc(a.id)+'"><span class="lv-chip">'+esc(a.type)+'</span>'
      + '<div class="lv-main"><div>'+esc(fmtRange(a.from, a.to))+'</div><small>'+n+(n===1?' día hábil':' días hábiles')+' · vuelves el '+esc(fmtShort(returnDay(a.to)))+(a.note?' · '+esc(a.note):'')+'</small></div>'
      + '<button data-act="lvEdit">Editar</button><button class="del" data-act="lvDel">Eliminar</button></div>'; };
  document.getElementById("body").innerHTML = '<div class="leave">'
    + '<div class="rep-sec"><h3>'+(leaveEdit ? 'Editar ausencia' : 'Agregar ausencia')+'</h3>'
    + '<div class="lf-grid">'
    + '<label>Tipo<select id="lvType">'+typeOpts+'</select></label>'
    + '<label>Primer día<input type="date" id="lvFrom" value="'+esc(d.from)+'"></label>'
    + '<label>Último día de ausencia<input type="date" id="lvTo" value="'+esc(d.to)+'"></label>'
    + '<label class="wide">Nota (opcional)<input id="lvNote" value="'+esc(d.note)+'" placeholder="Ej.: vacaciones de fin de año" autocomplete="off"></label>'
    + '</div><p class="lv-info" id="lvInfo"></p>'
    + '<div class="lf-btns"><button class="primary" data-act="lvSave">'+(leaveEdit ? 'Guardar cambios' : 'Agregar')+'</button>'
    + (leaveEdit ? '<button class="secondary" data-act="lvCancel">Cancelar</button>' : '') + '</div></div>'
    + '<div class="rep-sec"><h3>Registradas <span class="n">'+list.length+'</span></h3>'
    + (list.length ? '<div>'+list.map(row).join("")+'</div>' : '<p class="none">Aún no tienes vacaciones ni permisos registrados.</p>')
    + '</div></div>';
  updateLeaveInfo();

async function leaveAction(act, id){
  if (act === "lvSave"){
    const c = leaveCheck(leaveDraft);
    if (!c.ok){ updateLeaveInfo(); toast(c.msg); return; }
    const data = {type:leaveDraft.type, from:leaveDraft.from, to:leaveDraft.to, note:leaveDraft.note.trim()};
    if (leaveEdit){ Object.assign(state.absences.find(a => a.id === leaveEdit) || {}, data); toast("Cambios guardados."); }
    else { state.absences.push({id:uid(), ...data}); toast(data.type + " registrado: " + c.msg); }
    leaveEdit = null; leaveDraft = {type:"Vacaciones", from:"", to:"", note:""};
    commit();
  }
  if (act === "lvCancel"){ leaveEdit = null; leaveDraft = {type:"Vacaciones", from:"", to:"", note:""}; renderMain(); }
  if (act === "lvEdit"){
    const a = state.absences.find(x => x.id === id); if (!a) return;
    leaveEdit = a.id; leaveDraft = {type:a.type, from:a.from, to:a.to, note:a.note}; renderMain();
    document.getElementById("body").scrollTop = 0;
  }
  if (act === "lvDel"){
    const a = state.absences.find(x => x.id === id); if (!a) return;
    const ok = await confirmBox("¿Eliminar " + a.type.toLowerCase() + " del " + fmtRange(a.from, a.to) + "?", "Eliminar");
    if (!ok) return;
    state.absences = state.absences.filter(x => x.id !== id);
    if (leaveEdit === id){ leaveEdit = null; leaveDraft = {type:"Vacaciones", from:"", to:"", note:""}; }
    commit();
  }
}

/* ---------- Informe ---------- */
function reportData(d){
  let open = state.tasks.filter(t => !t.done);
  const doneDay = state.tasks.filter(t => t.done && t.completedAt && ymd(new Date(t.completedAt)) === d).sort(sortDone);
  const paused = open.filter(t => t.paused).sort(sortOpen);
  open = open.filter(t => !t.paused);
  const doing = open.filter(t => t.doing).sort(sortOpen);
  const pend = open.filter(t => !t.doing && (t.myDay === d || t.due === d || (hasSpan(t) && t.start <= d && d <= t.due))).sort(sortOpen);
  const late = open.filter(t => !t.doing && t.due && t.due < d && t.myDay !== d).sort((a,b) => a.due.localeCompare(b.due));
  const next = open.filter(t => !t.doing && t.due && t.due > d && t.due <= addDays(d,7) && t.myDay !== d && !(hasSpan(t) && t.start <= d)).sort((a,b) => a.due.localeCompare(b.due));
  return {doing, doneDay, pend, late, next, paused};
}
function lineInfo(t, withDue){
  const bits = [];
  if (t.listId !== "tasks") bits.push(listName(t.listId));
  if (t.steps.length) bits.push(t.steps.filter(s=>s.done).length + " de " + t.steps.length + " pasos");
  if (withDue && t.due) bits.push("vence " + fmtShort(t.due));
  if (t.important) bits.push("importante");
  if (t.paused){ if (t.pausedAt) bits.push("desde el " + fmtShort(t.pausedAt)); if (t.pauseReason) bits.push("motivo: " + t.pauseReason); }
  return bits;
}
function reportText(d){
  const r = reportData(d);
  const sec = (title, arr, withDue) => {
    let s = "\n" + title + " (" + arr.length + ")\n";
    if (!arr.length) return s + "  • Sin tareas\n";
    arr.forEach(t => { const b = lineInfo(t, withDue); s += "  • " + t.title + (b.length ? " — " + b.join(", ") : "") + "\n"; });
    return s;
  };
  const head = "Avance del " + fmtLongY(d);
  return head + "\n" + "-".repeat(head.length) + "\n"
    + sec("En curso", r.doing, true)
    + sec("Terminadas", r.doneDay, false)
    + sec("Pendientes para el día", r.pend, true)
    + sec("Atrasadas", r.late, true)
    + sec("Próximos 7 días", r.next, true)
    + sec("En pausa", r.paused, true);
}
function renderReport(){
  const title = document.getElementById("title");
  title.value = "Informe del día";
  document.getElementById("subtitle").textContent = "Resumen listo para enviar a tu jefatura por correo o Teams";
  const r = reportData(reportDate);
  const sec = (ttl, arr, withDue) => '<div class="rep-sec"><h3>'+ttl+' <span class="n">'+arr.length+'</span></h3>'

  document.getElementById("body").innerHTML = '<div class="report">'
    + '<div class="rep-bar"><input type="date" id="repDate" value="'+reportDate+'" aria-label="Fecha del informe">'

    + '<label style="font-weight:600">Texto para copiar</label><textarea class="rep-text" id="repText" readonly>'+esc(reportText(reportDate))+'</textarea>'
    + '</div>';

function setView(v){
  view = v; showSugg = false;
  if (v !== "search"){ query = ""; document.getElementById("q").value = ""; }

  if (add && window.matchMedia("(min-width:901px)").matches) add.focus();

function addTask(title){
  title = title.trim(); if (!title) return;
  const t = {id:uid(), title, done:false, important:false, doing:false, myDay:"", due:"", start:"", paused:false, pauseReason:"", pausedAt:"", repeat:"", repeatDays:[],
    listId:"tasks", notes:"", steps:[], createdAt:Date.now(), completedAt:0};
  if (view === "myday") t.myDay = today();
  if (view === "important") t.important = true;
  if (view === "planned") t.due = today();
  if (view.startsWith("list:")) t.listId = view.slice(5);
  state.tasks.push(t);
  commit();
  const add = document.getElementById("addInput"); if (add) add.focus();
}
function toggleTask(id){
  const t = byId(id); if (!t) return;
  t.done = !t.done;
  t.completedAt = t.done ? Date.now() : 0;
  if (t.done){ t.doing = false; t.paused = false; t.pauseReason = ""; t.pausedAt = ""; }
  let msg = "";
  if (t.done && t.repeat && t.due){
    let nd = nextRepeat(t.due, t.repeat, t.repeatDays);
    for (let i = 0; i < 400 && nd < today(); i++) nd = nextRepeat(nd, t.repeat, t.repeatDays);
    const len = hasSpan(t) ? spanDays(t.start, t.due).length : 1;
    const ns = len > 1 ? prevWorkdays(nd, len - 1) : "";
    state.tasks.push({...t, id:uid(), done:false, completedAt:0, doing:false, paused:false, pauseReason:"", pausedAt:"", myDay:"", due:nd, start:ns,
      repeatDays:t.repeatDays.slice(), steps:t.steps.map(s => ({id:uid(), title:s.title, done:false})), createdAt:Date.now()});
    t.repeat = "";
    msg = "Próxima repetición: " + dueLabel(nd).toLowerCase();
  }
  commit();
  const row = document.querySelector('.task[data-id="'+CSS.escape(id)+'"]');
  if (row && t.done) row.classList.add("pop");
  if (msg) toast(msg);
}
async function deleteTask(id){
  const t = byId(id); if (!t) return;
  const ok = await confirmBox('¿Eliminar “'+t.title+'”? No se puede deshacer.', "Eliminar");
  if (!ok) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  if (selected === id) selected = null;
  commit();
}

/* Calendario: arrastrar para mover y estirar los bordes para cambiar la duración */
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
let calDrag = null, suppressClick = false;
function calNewDates(t, mode, from, to){
  let ns = t.start || "", nd = t.due || from;
  if (mode === "move"){
    const delta = daysBetween(from, to);
    nd = addDays(nd, delta); ns = ns ? addDays(ns, delta) : "";
  } else if (mode === "end"){
    if (!ns && to > nd) ns = nd;
    nd = to < (ns || to) ? ns : to;
  } else if (mode === "start"){
    ns = to > nd ? nd : to;
  }
  if (ns && ns >= nd) ns = "";
  return {ns, nd};
}
function calPreview(range){
  document.querySelectorAll(".cal-cell.drop").forEach(c => c.classList.remove("drop"));
  if (!range) return;
  document.querySelectorAll(".cal-grid .cal-cell[data-date], .gantt .g-col[data-date]").forEach(c => {
    const k = c.dataset.date; if (k >= (range.ns || range.nd) && k <= range.nd) c.classList.add("drop");
  });
}
function cellAt(x, y){ return (document.elementsFromPoint(x, y) || []).find(el => el.matches && el.matches(".cal-grid .cal-cell[data-date], .gantt .g-col[data-date]")) || null; }
bodyEl.addEventListener("pointerdown", e => {
  if ((view !== "calendar" && view !== "gantt") || e.button !== 0) return;
  const chip = e.target.closest(".cal-grid .cal-task:not(.ghost), .gantt .g-bar:not(.ghost)"); if (!chip) return;
  const t = byId(chip.dataset.id), cell = cellAt(e.clientX, e.clientY); if (!t || !cell) return;
  const rs = e.target.closest("[data-rs]");
  calDrag = {t, chip, mode: rs ? rs.dataset.rs : "move", from: cell.dataset.date, x: e.clientX, y: e.clientY, active: !!rs, to: cell.dataset.date};
  if (rs){ document.body.classList.add("cal-resize"); calPreview(calNewDates(t, calDrag.mode, calDrag.from, calDrag.to)); e.preventDefault(); }
  try { chip.setPointerCapture(e.pointerId); } catch(err){}
});
bodyEl.addEventListener("pointermove", e => {
  if (!calDrag) return;
  if (!calDrag.active){
    if (Math.abs(e.clientX - calDrag.x) + Math.abs(e.clientY - calDrag.y) < 6) return;
    calDrag.active = true; calDrag.chip.classList.add("dragging"); document.body.classList.add("cal-move");
  }
  const cell = cellAt(e.clientX, e.clientY); if (!cell) return;
  calDrag.to = cell.dataset.date;
  calPreview(calNewDates(calDrag.t, calDrag.mode, calDrag.from, calDrag.to));
});
function endCalDrag(apply){
  const d = calDrag; calDrag = null;
  document.body.classList.remove("cal-move", "cal-resize"); calPreview(null);
  if (!d) return;
  d.chip.classList.remove("dragging");
  if (!d.active) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 300);
  if (!apply) return;
  const {ns, nd} = calNewDates(d.t, d.mode, d.from, d.to);
  if (ns === (d.t.start || "") && nd === (d.t.due || "")) return;
  d.t.start = ns; d.t.due = nd; commit();
  const msg = ns ? "Del " + fmtShort(ns) + " al " + fmtShort(nd) : "Vence el " + fmtShort(nd);
  toast(!isWorkday(nd) ? msg + ". Ojo: ese día no se trabaja (" + nonWorkingText(nd) + ")." : msg + ".");
}
bodyEl.addEventListener("pointerup", () => endCalDrag(true));
bodyEl.addEventListener("pointercancel", () => endCalDrag(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && calDrag) endCalDrag(false); });

    case "due": { const v = b.dataset.v; t.due = v === "" ? "" : v === "mon" ? nextMonday() : addDays(today(), +v); if (!t.due){ t.repeat = ""; t.start = ""; } else if (t.start && t.start > t.due) t.start = t.due; commit(); break; }

    case "day": {
      const d = +b.dataset.d;
      if (t.repeatDays.includes(d)){
        if (t.repeatDays.length === 1){ toast("Elige al menos un día."); break; }
        t.repeatDays = t.repeatDays.filter(x => x !== d);

      if (t.due && !t.repeatDays.includes(parse(t.due).getDay())) t.due = firstOnOrAfter(t.due < today() ? today() : t.due, t.repeatDays);
      commit(); break;

    case "dClose": selected = null; renderMain(); renderDetail(); break;
    case "dDelete": deleteTask(t.id); break;

/* Diálogos y avisos */
function modal(html, wire){
  return new Promise(res => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
    document.body.appendChild(bg);
    const done = v => { bg.remove(); document.removeEventListener("keydown", onKey); res(v); };
    const onKey = e => { if (e.key === "Escape") done(null); };
    document.addEventListener("keydown", onKey);
    bg.addEventListener("click", e => { if (e.target === bg) done(null); });
    wire(bg, done);
  });
}
function confirmBox(msg, okTxt){
  return modal('<p>'+esc(msg)+'</p><div class="btns"><button class="secondary" data-v="0">Cancelar</button><button class="btn-danger" data-v="1">'+esc(okTxt)+'</button></div>',
    (bg, done) => { bg.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => done(b.dataset.v === "1"))); bg.querySelector(".btn-danger").focus(); })
    .then(v => !!v);
}
function choiceBox(msg, opts){
  return modal('<p>'+esc(msg)+'</p><div class="btns"><button class="secondary" data-v="">Cancelar</button>'+opts.map(o => '<button class="primary" data-v="'+o[0]+'">'+esc(o[1])+'</button>').join("")+'</div>',
    (bg, done) => bg.querySelectorAll("[data-v]").forEach(b => b.addEventListener("click", () => done(b.dataset.v || null))));
}
let toastTimer = null;
function toast(msg){
  let t = document.querySelector(".toast");
  if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3200);
}

/* Cambio de día: Mi día se reinicia solo */
function checkDay(){ if (today() !== currentDay){ currentDay = today(); if (reportDate < currentDay) reportDate = currentDay; renderSide(); renderMain(); renderDetail(); } }
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
setInterval(checkDay, 60000);

/* Inicio */
document.getElementById("brandMark").innerHTML = I.check.replace(/width="12" height="12"/,'width="16" height="16"');
document.getElementById("searchIco").innerHTML = I.search;
document.getElementById("burger").innerHTML = I.menu;
document.getElementById("newList").innerHTML = I.plus + "Nueva lista";
document.getElementById("backupBtn").innerHTML = I.save + "Respaldo";
document.getElementById("logoutBtn").innerHTML = I.x + "Cerrar sesión";
document.getElementById("loginMark").innerHTML = document.getElementById("brandMark").innerHTML;
document.getElementById("logoutBtn").addEventListener("click", logout);

/* App instalable (PWA): ícono en el teléfono y apertura sin la barra del navegador */
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
let installEvt = null;
const installBtn = document.getElementById("installBtn");
installBtn.innerHTML = I.save + "Instalar app";
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
installBtn.addEventListener("click", async () => {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch(err){}
  installEvt = null; installBtn.hidden = true;
});
window.addEventListener("appinstalled", () => { installBtn.hidden = true; toast("App instalada. La encuentras como “Mis tareas”."); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && token) loadRemote(false); });
window.addEventListener("online", () => { if (token){ lastError = false; flush(); } });
snapshotShadow();
if (token){ showApp(); if (pending.length) flush(); loadRemote(true); }
else showLogin("");
})();
</script>
